# Local development stack: Postgres + migrations + app.
#
# Everyday local dev (Next on the host, Postgres in Docker):
#   docker compose up -d db
#   npm run db:migrate
#   npm run dev
#
# Full containerised run, closest to production:
#   docker compose up --build
#
# `migrate` runs to completion before `app` starts.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kfless
      POSTGRES_PASSWORD: kfless
      POSTGRES_DB: kfless_games
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kfless -d kfless_games']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://kfless:kfless@db:5432/kfless_games
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgres://kfless:kfless@db:5432/kfless_games
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me}
      ADMIN_CREDENTIAL: ${ADMIN_CREDENTIAL:-dev-only-admin-credential}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
